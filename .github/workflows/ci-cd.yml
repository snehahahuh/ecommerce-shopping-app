name: E-Commerce CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-test:
    name: Build, Test and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test Application Files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All application files are present."

      - name: Build Application
        run: |
          mkdir build
          cp index.html style.css script.js build/
          echo "Build completed successfully."

      - name: Package Application
        run: |
          zip -r ecommerce-shopping-app.zip build
          echo "Package created successfully."

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-shopping-app
          path: ecommerce-shopping-app.zip

  deploy:
    name: Deploy to GitHub Pages
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4